name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python examples/capture_demo.py
      - run: python -m build
      - name: Verify installed wheel outside source tree
        shell: bash
        run: |
          python -m venv wheel-env
          if [ "$RUNNER_OS" = "Windows" ]; then PY=wheel-env/Scripts/python; else PY=wheel-env/bin/python; fi
          "$PY" -m pip install dist/*.whl
          "$PY" tools/check_wheel.py
